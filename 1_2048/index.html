<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2048</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <p class="game-explanation">
        <strong class="important">How to play:</strong>
        Use your arrow keys to move the tiles. When two tiles with the same
        number touch, they merge into one!

    <h1>2048</h1>
    
    <h2 id="score">Score: 0</h2>
    <div id="board"></div>
    <div id="game-over" class="hidden">Game Over! Your score is 0</div>
    <button id="restart-button" class="hidden">Restart Game</button>
    <script src="script.js"></script>
    
      
</body>
</html>
